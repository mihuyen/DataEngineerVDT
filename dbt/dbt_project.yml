name: stock_lakehouse
version: "1.0.0"
config-version: 2

profile: stock_lakehouse

model-paths: ["models"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  stock_lakehouse:
    +materialized: view
    staging:
      # Kept as a full table rebuild every run, not incremental: marts'
      # rolling-window calculations need the complete ticker history as
      # input, so trimming staging incrementally would corrupt those
      # windows near the trim boundary.
      +materialized: table
    marts:
      +materialized: incremental
      +incremental_strategy: delete_insert
      +unique_key: ['ticker', 'date_id']
