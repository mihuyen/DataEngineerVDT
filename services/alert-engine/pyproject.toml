[project]
name = "stock-alert-engine"
version = "0.1.0"
description = "Minimal runtime deps for the alert engine only -- it never builds/reads a DataFrame, so no polars/pandas/pyarrow."
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=1.2.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[tool.uv]
package = false
