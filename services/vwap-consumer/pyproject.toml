[project]
name = "stock-vwap-consumer"
version = "0.1.0"
description = "Minimal runtime deps for the realtime VWAP consumer only -- it round-trips DataFrames through ClickHouse, alert-engine does not."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "clickhouse-connect>=1.2.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
