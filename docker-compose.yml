services:
  minio:
    image: minio/minio:latest
    container_name: stock-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: stock-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-stock_lakehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/ddl:/docker-entrypoint-initdb.d:ro

  nlp-service:
    build:
      context: .
      dockerfile: nlp/serving/Dockerfile
    image: stock-nlp:local
    container_name: stock-nlp
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      HF_MODEL_REPO: ${HF_MODEL_REPO:-wonrax/phobert-base-vietnamese-sentiment}
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_VERSION: ${MODEL_VERSION:-wonrax-phobert-general-baseline}
      LOAD_SOCIAL_MODEL: ${LOAD_SOCIAL_MODEL:-false}
      LOAD_TOPIC_MODEL: ${LOAD_TOPIC_MODEL:-false}
      HF_HOME: /models/huggingface
    volumes:
      - huggingface_cache:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:16
    container_name: stock-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_password}
      POSTGRES_DB: ${POSTGRES_DB:-stock_lakehouse}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  alert-engine:
    build:
      context: .
      dockerfile: docker/alert-engine.Dockerfile
    image: stock-alert-engine-uv:local
    container_name: stock-alert-engine
    restart: unless-stopped
    depends_on:
      - clickhouse
      - postgres
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv-alert-engine
      PYTHONIOENCODING: utf-8
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DATABASE: stock_lakehouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-stock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_password}
      POSTGRES_DB: ${POSTGRES_DB:-stock_lakehouse}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_SUBJECT: ${SMTP_SUBJECT:-Stocky - Stock Alert}
      ALERT_CHECK_INTERVAL_SECONDS: ${ALERT_CHECK_INTERVAL_SECONDS:-60}
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "uv run python scripts/init_user_alerts.py &&
      uv run python scripts/run_alert_engine.py --interval-seconds ${ALERT_CHECK_INTERVAL_SECONDS:-60}"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: stock-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: stock-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  realtime-vwap-consumer:
    build:
      context: .
      dockerfile: docker/alert-engine.Dockerfile
    image: stock-alert-engine-uv:local
    container_name: stock-realtime-vwap-consumer
    restart: unless-stopped
    depends_on:
      - clickhouse
      - kafka
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv-realtime-consumer
      PYTHONIOENCODING: utf-8
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DATABASE: stock_lakehouse
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "uv run python scripts/init_realtime_streaming.py &&
      uv run python scripts/run_realtime_vwap_kafka_consumer.py --interval-seconds 15"

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: stock-airflow-uv:local
    container_name: stock-airflow-webserver
    restart: unless-stopped
    user: "${AIRFLOW_UID:-1000}:0"
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-stock_user}:${POSTGRES_PASSWORD:-stock_password}@postgres:5432/${POSTGRES_DB:-stock_lakehouse}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-change_me_airflow}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Data
      --lastname Engineer
      --role Admin
      --email admin@example.com || true &&
      airflow webserver"

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: stock-airflow-uv:local
    container_name: stock-airflow-scheduler
    restart: unless-stopped
    user: "${AIRFLOW_UID:-1000}:0"
    depends_on:
      - postgres
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-stock_user}:${POSTGRES_PASSWORD:-stock_password}@postgres:5432/${POSTGRES_DB:-stock_lakehouse}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-change_me_airflow}
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
    command: bash -c "airflow db migrate && airflow scheduler"

  superset:
    image: apache/superset:latest
    container_name: stock-superset
    restart: unless-stopped
    depends_on:
      - postgres
      - clickhouse
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change_me}
      PYTHONPATH: /app/superset_home/.local/lib/python3.10/site-packages:/app/pythonpath
    volumes:
      - superset_data:/app/superset_home
    command: >
      bash -c "pip install --user clickhouse-connect &&
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname Data
      --lastname Engineer
      --email admin@example.com
      --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"

  grafana:
    image: grafana/grafana:latest
    container_name: stock-grafana
    restart: unless-stopped
    depends_on:
      - clickhouse
      - postgres
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/etc/grafana/dashboards

volumes:
  minio_data:
  clickhouse_data:
  postgres_data:
  superset_data:
  grafana_data:
  huggingface_cache:
