apiVersion: 1

contactPoints:
  - orgId: 1
    name: ops-default
    receivers:
      - uid: ops-default-log
        type: email
        settings:
          # Real Gmail SMTP, enabled via GF_SMTP_* env vars in
          # docker-compose.yml (values come from .env, never committed).
          # Grafana's alerting provisioning does not support $__env{} value
          # expansion for contact point settings (only for datasource
          # secureJsonData), so the recipient address has to be a literal
          # value here -- keep this file itself out of any public fork if
          # that address should stay private.
          addresses: buihuyenmi2005@gmail.com
          singleEmail: true
        disableResolveMessage: false
