[project]
name = "stock-news-nlp"
version = "0.1.0"
description = "Three-class Vietnamese financial news sentiment service"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.110.0",
    "huggingface-hub==0.23.4",
    "numpy<2",
    "pydantic==2.6.3",
    "python-dotenv==1.0.0",
    "torch==2.1.2",
    "transformers==4.41.2",
    "underthesea==6.8.4",
    "uvicorn==0.27.1",
]

[dependency-groups]
training = [
    "accelerate>=0.30,<1",
    "mlflow>=2.12,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<2",
]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
